# Wraps this playable build in an Android app (Capacitor WebView) and publishes the APK
# on the "latest" release, so the phone can download it from the Releases page.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect the web build
        run: |
          mkdir -p app/www
          rsync -a --exclude='.git' --exclude='.github' --exclude='app' --exclude='README.md' --exclude='.nojekyll' ./ app/www/

      - name: Create the Android project
        working-directory: app
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "최후의 성채" com.hyo7170.lastcitadel --web-dir www
          npx cap add android
          # Landscape only, like the game is designed for.
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          # Version: increases with every run so the phone accepts it as an update.
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          # A fixed debug key, so new builds install over old ones and keep the saved game.
          mkdir -p ~/.android && cp ../../.github/android/debug.keystore ~/.android/debug.keystore
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../last-citadel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: last-citadel-apk
          path: last-citadel.apk

      - name: Publish on the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="빌드 ${{ github.run_number }} · 커밋 ${GITHUB_SHA::7}. 휴대폰에서 last-citadel.apk 를 받아 설치합니다."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest last-citadel.apk --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest last-citadel.apk --title "최신 안드로이드 빌드" --notes "$notes"
          fi
